<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>draw-repair</title>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <main id="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div id="room-editor" hidden>
            <input id="room-name" class="room-name-input" type="text" placeholder="Комната" title="Название помещения" />
            <input id="room-height" class="room-height-input" type="text" inputmode="numeric" title="Высота, мм" />
          </div>
          <header id="tabbar" class="panel">
            <div id="tab-row">
              <div id="tabs"></div>
              <button id="tab-add" title="Новый чертёж" type="button">+</button>
            </div>
            <div id="plan-switch" aria-label="Планы"></div>
          </header>
          <aside id="toolbar" class="panel">
            <div class="tool-anchor" data-tools="demolition">
              <button id="tool-demolition" class="tool" title="Демонтаж" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><g transform="rotate(-40 12 12)"><rect x="6" y="3.5" width="12" height="5.5" rx="1" fill="currentColor"/><path d="M12 9v12"/></g><path d="M3 21h6M15.5 21h5.5"/></svg>
              </button>
            </div>
            <div class="tool-anchor" data-tools="plaster">
              <button id="tool-plaster" class="tool" title="Штукатурка" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="9" height="14"/><rect x="12" y="5" width="4" height="14" fill="currentColor"/><path d="M19.5 5v14"/></svg>
              </button>
              <div id="plaster-panel" class="panel tool-panel">
                <label class="thickness-field" title="Толщина штукатурки, мм">
                  <span>мм</span>
                  <input id="plaster-thickness" type="text" inputmode="numeric" value="20" />
                </label>
              </div>
            </div>
            <div class="tool-anchor" data-tools="screed">
              <button id="tool-screed" class="tool" title="Стяжка" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="14"/><path d="M8 19L13 5M13 19l5-14M3.5 14.5L8.5 5M15 19l5.5-9"/></svg>
              </button>
              <div id="screed-panel" class="panel tool-panel">
                <label class="thickness-field" title="Высота стяжки h, мм">
                  <span>h, мм</span>
                  <input id="screed-thickness" type="text" inputmode="numeric" value="50" />
                </label>
              </div>
            </div>
            <div class="tool-anchor" data-tools="drywall">
              <button id="tool-drywall" class="tool" title="Гипсокартон" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" fill="currentColor" fill-opacity=".35"/><path d="M3 5.5h18M3 18.5h18" stroke-width="1.2"/></svg>
              </button>
              <div id="drywall-panel" class="panel tool-panel">
                <label class="thickness-field" title="Толщина стены гипсокартона">
                  <span id="drywall-thickness-unit">Толщина, мм</span>
                  <input id="drywall-thickness" type="text" inputmode="decimal" />
                </label>
                <label class="thickness-field" title="Высота стены гипсокартона">
                  <span id="drywall-height-unit">Высота, мм</span>
                  <input id="drywall-height" type="text" inputmode="decimal" />
                </label>
              </div>
            </div>
            <div class="tool-anchor" data-tools="wall">
              <button id="tool-wall" class="tool active" title="Стена" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="8" height="4" rx=".8"/><rect x="12.5" y="5" width="8.5" height="4" rx=".8"/><rect x="3" y="10.5" width="3.5" height="4" rx=".8"/><rect x="8" y="10.5" width="8" height="4" rx=".8"/><rect x="17.5" y="10.5" width="3.5" height="4" rx=".8"/><rect x="3" y="16" width="8" height="4" rx=".8"/><rect x="12.5" y="16" width="8.5" height="4" rx=".8"/></svg>
              </button>
              <div id="wall-panel" class="panel tool-panel">
                <label id="thickness-label" title="Толщина стены">
                  <span id="thickness-unit">мм</span>
                  <input id="thickness" type="number" value="200" />
                </label>
                <div id="wall-types" aria-label="Материал стены">
                  <button class="wall-type" data-material="blocks" title="Блоки" type="button"><canvas width="36" height="14"></canvas><span>Блоки</span></button>
                  <button class="wall-type active" data-material="brick" title="Кирпич" type="button"><canvas width="36" height="14"></canvas><span>Кирпич</span></button>
                  <button class="wall-type" data-material="concrete" title="Бетон" type="button"><canvas width="36" height="14"></canvas><span>Бетон</span></button>
                  <button class="wall-type" data-material="gkl" title="ГКЛ" type="button"><canvas width="36" height="14"></canvas><span>ГКЛ</span></button>
                  <button class="wall-type" data-material="wood-long" title="Дерево" type="button"><canvas width="36" height="14"></canvas><span>Дерево</span></button>
                </div>
              </div>
            </div>
            <div class="tool-anchor" data-tools="doorway door">
              <button id="tool-openings" class="tool" title="Проёмы" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M3 4h18v16H3z M7.5 7.5h9V20h-9z"/><path d="M7.5 7.5l5 2V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 20.5h20" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <div id="openings-panel" class="panel tool-panel">
                <div class="group-tools" aria-label="Инструменты группы «Проёмы»">
                  <button id="tool-doorway" class="group-tool active" title="Проём" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M3 4h18v16H3z M7.5 7.5h9V20h-9z"/><path d="M2 20.5h20" stroke="currentColor" stroke-width="1.5"/></svg>
                    <span>Проём</span>
                  </button>
                  <button id="tool-door" class="group-tool" title="Дверь" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="3" width="12" height="17"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M3 20.5h18" stroke-width="2.2"/></svg>
                    <span>Дверь</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="tool-anchor" data-tools="window">
              <button id="tool-window" class="tool" title="Окно" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="3" width="14" height="15"/><path d="M5 8h14M12 8v10"/><path d="M3 20.5h18" stroke-width="2.2"/></svg>
              </button>
            </div>
            <div class="tool-anchor" data-tools="battery">
              <button id="tool-battery" class="tool" title="Батарея" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4.5h18" stroke-width="2.2"/><rect x="4" y="8" width="16" height="10"/><path d="M8 8v10M12 8v10M16 8v10"/></svg>
              </button>
            </div>
            <div class="tool-anchor" data-tools="riser duct">
              <button id="tool-communications" class="tool" title="Коммуникации" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="3.5"/><rect x="12" y="12" width="9" height="8"/><path d="M12 12l9 8"/></svg>
              </button>
              <div id="communications-panel" class="panel tool-panel">
                <div class="group-tools" aria-label="Инструменты группы «Коммуникации»">
                  <button id="tool-riser" class="group-tool active" title="Стояк" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/></svg>
                    <span>Стояк</span>
                  </button>
                  <button id="tool-duct" class="group-tool" title="Воздуховод" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12"/><path d="M4 6l16 12"/></svg>
                    <span>Воздуховод</span>
                  </button>
                </div>
              </div>
            </div>
            <hr class="tool-separator" data-plan="measure mounting" />
            <div class="tool-anchor" data-tools="dimension">
              <button id="tool-dimension" class="tool" title="Размер" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13v8M20.5 13v8M3.5 17h17M3.5 17l2.5-2M3.5 17l2.5 2M20.5 17l-2.5-2M20.5 17l-2.5 2"/><text x="12" y="11" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">120</text></svg>
              </button>
            </div>
            <div class="tool-anchor" data-tools="callout">
              <button id="tool-callout" class="tool" title="Выноска" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L12 12M4 20l3-.5M4 20l.5-3M12 12h8"/></svg>
              </button>
            </div>
            <button id="tool-ruler" class="tool" title="Линейка" type="button" data-tools="ruler">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="6" width="12" height="12" rx="3"/><circle cx="8" cy="12" r="2.5"/><path d="M14 14.5h7.5v3H14"/><path d="M21.5 12.5v5"/><path d="M16.5 14.5v1.5M19 14.5v1.5"/></svg>
            </button>
            <div class="tool-anchor" data-tools="notes">
              <button id="tool-notes" class="tool" title="Примечания" type="button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="1.5"/><path d="M8 8h1M11 8h5M8 12h1M11 12h5M8 16h1M11 16h5"/></svg>
              </button>
              <div id="notes-panel" class="panel tool-panel">
                <label id="notes-label">
                  <span>Примечание</span>
                  <textarea id="notes-input" rows="6" spellcheck="false" aria-label="Примечания плана: один пункт на строку"></textarea>
                </label>
              </div>
            </div>
            <hr class="tool-separator" data-plan="measure mounting" />
            <button id="tool-eraser" class="tool" title="Ластик" type="button" data-tools="eraser">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><g transform="rotate(-30 12 11)"><rect x="3" y="7" width="18" height="8" rx="1.5"/><path d="M10 7v8"/><path d="M3 8.5a1.5 1.5 0 0 1 1.5-1.5H10v8H4.5A1.5 1.5 0 0 1 3 13.5z" fill="currentColor"/></g><path d="M4 21h9"/></svg>
            </button>
          </aside>
          <div id="size-box" class="panel">
            <select id="render-style" title="Стиль отображения">
              <option value="gost" selected>ГОСТ</option>
            </select>
            <button id="theme-toggle" title="Тёмная тема" type="button">
              <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg>
              <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <select id="pdf-format" title="Формат страницы PDF">
              <option value="A4" selected>A4</option>
              <option value="A3">A3</option>
              <option value="A2">A2</option>
              <option value="A1">A1</option>
              <option value="A0">A0</option>
            </select>
            <span id="scale-label" title="Масштаб чертежа"></span>
            <button id="pdf-export" title="Сохранить в PDF" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3v12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="undo-btn" title="Отменить (Ctrl+Z)" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5h-4" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="redo-btn" title="Повторить (Ctrl+Shift+Z)" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a5 5 0 0 0-5 5v1a5 5 0 0 0 5 5h4" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="ortho-toggle" class="active" title="Орто-привязка" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 17V7h10" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>
            </button>
            <label id="length-label">Длина<input id="length" type="text" inputmode="decimal" placeholder="—" /></label>
            <label id="angle-label">Угол<input id="angle" type="text" inputmode="decimal" placeholder="—" disabled />°</label>
            <div id="unit-row" aria-label="Единицы длины">
              <button class="unit" data-unit="m" type="button">м</button>
              <button class="unit" data-unit="cm" type="button">см</button>
              <button class="unit active" data-unit="mm" type="button">мм</button>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
