<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>draw-repair</title>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <main id="canvas-wrap">
          <canvas id="canvas"></canvas>
          <header id="tabbar" class="panel">
            <div id="tabs"></div>
            <button id="tab-add" title="Новый чертёж" type="button">+</button>
          </header>
          <aside id="toolbar" class="panel">
            <div class="tool-anchor">
              <button id="tool-wall" class="tool active" title="Стена" type="button">
                <svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="4" rx="1" fill="currentColor"/></svg>
              </button>
              <div id="wall-panel" class="panel tool-panel">
                <label id="thickness-label" title="Толщина стены">
                  <span id="thickness-unit">мм</span>
                  <input id="thickness" type="number" value="200" />
                </label>
                <div id="wall-types" aria-label="Материал стены">
                  <button class="wall-type active" data-material="brick" title="Кирпич" type="button"><canvas width="36" height="14"></canvas><span>Кирпич</span></button>
                  <button class="wall-type" data-material="concrete" title="Бетон" type="button"><canvas width="36" height="14"></canvas><span>Бетон</span></button>
                  <button class="wall-type" data-material="reinforced" title="Железобетон" type="button"><canvas width="36" height="14"></canvas><span>Железобетон</span></button>
                  <button class="wall-type" data-material="wood-long" title="Дерево (вдоль)" type="button"><canvas width="36" height="14"></canvas><span>Дерево (вдоль)</span></button>
                </div>
              </div>
            </div>
            <button id="tool-eraser" class="tool" title="Ластик" type="button">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
          </aside>
          <div id="size-box" class="panel">
            <select id="render-style" title="Стиль отображения">
              <option value="gost" selected>ГОСТ</option>
            </select>
            <select id="pdf-scale" title="Масштаб чертежа">
              <option value="50">1:50</option>
              <option value="100" selected>1:100</option>
              <option value="200">1:200</option>
              <option value="500">1:500</option>
            </select>
            <select id="pdf-format" title="Формат страницы PDF">
              <option value="A4" selected>A4</option>
              <option value="A3">A3</option>
              <option value="A2">A2</option>
              <option value="A1">A1</option>
              <option value="A0">A0</option>
            </select>
            <button id="pdf-export" title="Сохранить в PDF" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3v12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="undo-btn" title="Отменить (Ctrl+Z)" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5h-4" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="redo-btn" title="Повторить (Ctrl+Shift+Z)" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a5 5 0 0 0-5 5v1a5 5 0 0 0 5 5h4" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="ortho-toggle" title="Орто-привязка" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 17V7h10" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>
            </button>
            <label id="length-label">Длина<input id="length" type="text" inputmode="decimal" placeholder="—" /></label>
            <div id="unit-row" aria-label="Единицы длины">
              <button class="unit" data-unit="m" type="button">м</button>
              <button class="unit" data-unit="cm" type="button">см</button>
              <button class="unit active" data-unit="mm" type="button">мм</button>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
